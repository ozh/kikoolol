<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ INDEX ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --c1: #ff006e;
            --c2: #8338ec;
            --c3: #3a86ff;
            --c4: #fb5607;
            --c5: #ffbe0b;
            --c6: #06d6a0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Fredoka One', cursive;
            min-height: 100vh;
            background: #0a0a0a;
            overflow-x: hidden;
        }

        /* Animated tiled background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(131,56,236,.07) 20px, rgba(131,56,236,.07) 21px),
                repeating-linear-gradient(-45deg, transparent, transparent 20px, rgba(255,0,110,.07) 20px, rgba(255,0,110,.07) 21px);
            z-index: 0;
        }

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--d) ease-in-out infinite alternate;
            opacity: 0;
        }
        @keyframes twinkle {
            to { opacity: .8; }
        }

        .wrapper {
            position: relative;
            z-index: 1;
            padding: 40px 20px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        /* === HEADER === */
        .header {
            text-align: center;
        }

        .title {
            font-family: 'Bungee', cursive;
            font-size: clamp(2.8rem, 8vw, 5rem);
            letter-spacing: 4px;
            background: linear-gradient(90deg, var(--c1), var(--c5), var(--c2), var(--c3), var(--c6), var(--c4));
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbow 3s linear infinite;
            text-shadow: none;
            filter: drop-shadow(0 0 20px rgba(255,0,110,.4));
        }

        @keyframes rainbow {
            to { background-position: 300% center; }
        }

        .subtitle {
            color: rgba(255,255,255,.5);
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 8px;
            font-family: monospace;
        }

        /* === GRID === */
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
            width: 100%;
            max-width: 600px;
        }

        /* === CARD === */
        /* Wrapper handles the animated gradient border via padding */
        .card {
            position: relative;
            border-radius: 16px;
            text-decoration: none;
            display: block;
            padding: 3px;
            background: var(--grad);
            animation: popin .4s cubic-bezier(.34,1.56,.64,1) both, borderSpin 3s linear infinite;
            animation-delay: var(--delay), 0s;
        }

        @keyframes popin {
            from { opacity: 0; transform: scale(.7) rotate(-3deg); }
            to   { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        @keyframes borderSpin {
            to { filter: hue-rotate(360deg); }
        }

        .card-inner {
            background: #111;
            border-radius: 14px;
            padding: 22px 24px;
            transition: background .3s;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card:hover .card-inner {
            background: #1a1a1a;
        }

        .card:hover {
            transform: translateY(-4px) scale(1.02);
            transition: transform .2s cubic-bezier(.34,1.56,.64,1);
        }

        .icon {
            font-size: 2rem;
            flex-shrink: 0;
            filter: drop-shadow(0 0 8px currentColor);
            animation: wiggle 2s ease-in-out infinite;
            animation-delay: var(--delay);
        }

        @keyframes wiggle {
            0%,100% { transform: rotate(-5deg); }
            50%      { transform: rotate(5deg); }
        }

        .name {
            font-size: 1.15rem;
            color: #fff;
            word-break: break-all;
            letter-spacing: .5px;
        }
        .name strong {
            display: block;
            font-size: .75rem;
            color: rgba(255,255,255,.35);
            font-family: monospace;
            letter-spacing: 2px;
            margin-bottom: 2px;
            text-transform: uppercase;
            font-weight: normal;
        }

        .arrow {
            margin-left: auto;
            font-size: 1.2rem;
            color: rgba(255,255,255,.3);
            transition: all .2s;
            flex-shrink: 0;
        }
        .card:hover .arrow {
            color: #fff;
            transform: translateX(4px);
        }

        /* === STATE === */
        .state {
            text-align: center;
            color: rgba(255,255,255,.4);
            font-size: 1.1rem;
            font-family: monospace;
            padding: 40px;
        }
        .state.loading::after {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255,255,255,.3);
            border-top-color: var(--c2);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* === FOOTER === */
        .footer {
            color: rgba(255,255,255,.2);
            font-family: monospace;
            font-size: .75rem;
            letter-spacing: 2px;
        }

        /* === STICKER decorations === */
        .deco {
            position: fixed;
            font-size: 2rem;
            opacity: .15;
            pointer-events: none;
            animation: float var(--fd) ease-in-out infinite alternate;
            z-index: 0;
        }
        @keyframes float {
            to { transform: translateY(-20px) rotate(15deg); }
        }
    </style>
</head>
<body>

<div class="stars" id="stars"></div>

<!-- Floating decorations -->
<div class="deco" style="top:5%; left:3%; --fd:4s;">🌈</div>
<div class="deco" style="top:20%; right:4%; --fd:5s; font-size:3rem;">💫</div>
<div class="deco" style="bottom:15%; left:6%; --fd:3.5s;">🔥</div>
<div class="deco" style="bottom:30%; right:5%; --fd:6s; font-size:2.5rem;">✨</div>
<div class="deco" style="top:50%; left:2%; --fd:4.5s;">🌀</div>
<div class="deco" style="top:70%; right:3%; --fd:5.5s; font-size:3rem;">💎</div>

<div class="wrapper">
    <header class="header">
        <div class="title">★ INDEX ★</div>
        <div class="subtitle">~ * ~</div>
    </header>

    <div class="grid" id="grid">
        <div class="state loading" id="status">Loading</div>
    </div>

    <footer class="footer">✦ auto-generated via github api ✦</footer>
</div>

<script>
// ---- CONFIG ----
// Replace with your actual GitHub username and repo name
const GITHUB_USER = 'ozh';
const GITHUB_REPO = 'kikoolol';
// ----------------

const GRADIENTS = [
    'linear-gradient(135deg,#ff006e,#8338ec)',
    'linear-gradient(135deg,#3a86ff,#06d6a0)',
    'linear-gradient(135deg,#fb5607,#ffbe0b)',
    'linear-gradient(135deg,#8338ec,#3a86ff)',
    'linear-gradient(135deg,#06d6a0,#ffbe0b)',
    'linear-gradient(135deg,#ff006e,#fb5607)',
    'linear-gradient(135deg,#ffbe0b,#ff006e)',
    'linear-gradient(135deg,#06d6a0,#8338ec)',
];

const ICONS = ['🌐','🚀','💻','⚡','🎯','🔮','🌟','🎪','🎭','🎨','🦄','🍕'];

function pickIcon(name) {
    // Deterministic icon from folder name
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffff;
    return ICONS[h % ICONS.length];
}

function makeStars() {
    const container = document.getElementById('stars');
    for (let i = 0; i < 80; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${1+Math.random()*3}s;`;
        container.appendChild(s);
    }
}

function renderDirs(dirs) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    if (!dirs.length) {
        grid.innerHTML = '<div class="state">Aucun répertoire trouvé 😢</div>';
        return;
    }

    dirs.forEach((dir, i) => {
        const grad = GRADIENTS[i % GRADIENTS.length];
        const icon = pickIcon(dir.name);
        const a = document.createElement('a');
        a.className = 'card';
        a.href = dir.name + '/';
        a.style.cssText = `--grad:${grad};--delay:${i * 0.07}s`;
        a.innerHTML = `
            <div class="card-inner">
                <span class="icon" style="--delay:${i * 0.15}s">${icon}</span>
                <span class="name">
                    <strong>site</strong>
                    ${dir.name}
                </span>
                <span class="arrow">→</span>
            </div>
        `;
        grid.appendChild(a);
    });
}

async function loadDirs() {
    try {
        const res = await fetch(
            `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/`,
            { headers: { Accept: 'application/vnd.github.v3+json' } }
        );
        if (!res.ok) throw new Error(`GitHub API: ${res.status}`);
        const items = await res.json();
        const dirs = items.filter(i => i.type === 'dir').sort((a, b) => a.name.localeCompare(b.name));
        renderDirs(dirs);
    } catch (e) {
        document.getElementById('grid').innerHTML =
            `<div class="state">Erreur de chargement 😬<br><small>${e.message}</small></div>`;
    }
}

makeStars();
loadDirs();
</script>
</body>
</html>
